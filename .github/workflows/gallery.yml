name: Publish docs gallery
on:
  workflow_dispatch:
    inputs:
      publish_docs:
        description: Generate and commit the PR gallery, then request fresh checks
        type: boolean
        default: false
      pr_number:
        description: Open same-repository PR targeting main
        type: number
        required: true
permissions:
  contents: read
concurrency:
  group: gallery-pr-${{ inputs.pr_number }}
  cancel-in-progress: false
  queue: max
jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && inputs.publish_docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      head: ${{ steps.pr.outputs.head }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR: ${{ inputs.pr_number }}
        run: |
          if ($env:CI_PR -notmatch '^[1-9][0-9]*$') { throw 'Invalid PR number.' }
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:CI_PR" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pr.state -cne 'open' -or $pr.head.repo.full_name -cne $env:GITHUB_REPOSITORY -or $pr.base.ref -cne 'main') { throw 'Select an open same-repository PR targeting main.' }
          Add-Content $env:GITHUB_OUTPUT @("head=$($pr.head.sha)", "branch=$($pr.head.ref)")
  render:
    needs: resolve
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Enable long Windows checkout paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          persist-credentials: false
      - name: Prepare required MSVC 14.52 tools
        uses: ./.github/actions/setup-msvc
        with:
          platform: x64
      - shell: pwsh
        run: ./vcpkg-install.ps1 -Platform x64
      - shell: pwsh
        run: ./gallery.ps1 -Configuration Release -Platform x64 -PublishDocs
      - shell: pwsh
        run: ./validate-specs.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposed-docs-gallery
          path: docs/gallery/
          if-no-files-found: error
          retention-days: 14
  commit:
    needs: [resolve, render]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Enable long Windows checkout paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          path: .build/gallery-target
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposed-docs-gallery
          path: .build/generated-gallery
      - name: Commit only rendered data using trusted main code and request fresh PR checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          $target = Join-Path $PWD '.build/gallery-target'
          $head = (git -C $target rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_HEAD) { throw 'PR head moved during gallery generation; retain proposed data without pushing.' }
          $data = Join-Path $PWD '.build/generated-gallery'
          if (@(Get-ChildItem $data -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) { throw 'Gallery data cannot contain links.' }
          git -C $target rm -r --ignore-unmatch -- docs/gallery
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage gallery replacement.' }
          $destination = Join-Path $target 'docs/gallery'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem -LiteralPath $data -Force | Copy-Item -Destination $destination -Recurse
          ./Tools/Commit-Gallery.ps1 -Root $target -PullRequest $env:CI_PR
