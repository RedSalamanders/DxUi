name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@e4e6a14c6e7d7e2c20b72331e4a2ae8d117703f5
    with:
      engine_ref: e4e6a14c6e7d7e2c20b72331e4a2ae8d117703f5
