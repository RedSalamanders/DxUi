name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@dffe8b6bfc6d2d6d5f700378d59c85b35bf44bec
    with:
      engine_ref: dffe8b6bfc6d2d6d5f700378d59c85b35bf44bec
