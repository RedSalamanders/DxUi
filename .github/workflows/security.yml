name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@570351e14d469f2b1cefa7762fc64c1c24a4adf7
    with:
      engine_ref: 570351e14d469f2b1cefa7762fc64c1c24a4adf7
