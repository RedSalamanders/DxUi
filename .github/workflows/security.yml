name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@e3c637bd9a44bd409f30b5a1c1f28f155d2319dd
    with:
      engine_ref: e3c637bd9a44bd409f30b5a1c1f28f155d2319dd
