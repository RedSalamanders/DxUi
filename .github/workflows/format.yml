name: C++ formatting
on:
  push:
    paths: ['src/**', 'include/**', 'Tests/**', 'Samples/**', '.clang-format', 'format.ps1', '.github/workflows/format.yml']
  pull_request:
    paths: ['src/**', 'include/**', 'Tests/**', 'Samples/**', '.clang-format', 'format.ps1', '.github/workflows/format.yml']
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Commit formatting to the selected branch
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.apply_changes
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate formatting patch and check
        shell: pwsh
        run: |
          ./format.ps1
          git diff --binary --output=formatting.patch -- src include Tests Samples
          if ((Get-Item formatting.patch).Length -gt 0) { throw 'Formatting differs. Apply the uploaded patch or run format.ps1.' }
          ./format.ps1 -Check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: formatting-patch
          path: formatting.patch
  reformat:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_changes && startsWith(github.ref, 'refs/heads/')
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - shell: pwsh
        run: |
          ./format.ps1
          ./format.ps1 -Check
          git add -- src include Tests Samples
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot inspect formatting changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply clang-format'
          if ($LASTEXITCODE -ne 0) { throw 'Formatting commit failed.' }
          git push origin HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Formatting push failed; no force push was attempted.' }
