name: DxUi validation
on:
  # A pull request is validated on its merge ref, so a push validates only main: a push to a pull request's branch would run
  # everything again on the same code. Consumers adopt the main commit whose latest push run succeeded
  # (Tools/ConsumerUpdate.psm1). Start a run by hand to validate a branch that has no pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_baseline:
        description: Optional baseline revision for a paired x64 Release benchmark; empty skips it.
        required: false
        default: ''
      benchmark_candidate:
        description: Optional candidate revision for the paired benchmark; empty measures the dispatched ref.
        required: false
        default: ''
      benchmark_calibration_aa:
        description: Run diagnostic same-binary A/A calibration; requires the same explicit baseline and candidate revision.
        required: false
        type: boolean
        default: false
      benchmark_scenarios:
        description: Comma-separated performance.ps1 scenarios for the paired benchmark.
        required: false
        default: Default,MultilineGrid,MultilineGridDistinct
permissions:
  contents: read
concurrency:
  # A newer push cancels the older run of its ref, and so the older run of a pull request (refs/pull/<n>/merge) and its
  # paired benchmark. A manual dispatch is its own group: a push to the same ref, or another dispatch, must not throw
  # away a measurement someone asked for.
  group: dxui-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The hosted Ubuntu image ships PowerShell 7; every repository tool is a PowerShell script. One entry point runs the
      # five validators and the tooling tests and reports every failure before it fails.
      - shell: pwsh
        run: ./validate.ps1
  # Windows discovery/path/process branches need their own host qualification, once rather than once per native profile.
  windows-tooling:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: ./validate.ps1
      - shell: pwsh
        run: ./Tools/tests/Test-AsanRuntime.ps1
  format:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./Tools/Install-ClangFormat.ps1
      - shell: pwsh
        run: ./format.ps1 -Check
  # Whether this run needs the six native jobs (Tools/Get-NativeScope.ps1). A push to main and a manual run always do; a pull
  # request does unless every path it changes is documentation, which the validation job above checks. When this job fails,
  # the native jobs run anyway: nothing passes unbuilt because its scope could not be read. A documentation-only pull request
  # reports them skipped under their unexpanded matrix name, so no required check may name a native job.
  native-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge ref and its parents: the first is the base the merge ref was made on.
          fetch-depth: 2
      - id: scope
        shell: pwsh
        run: ./Tools/Get-NativeScope.ps1
  native:
    needs: native-scope
    if: ${{ !cancelled() && needs.native-scope.outputs.native != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-2025-vs2026
            configuration: Debug
          - platform: x64
            runner: windows-2025-vs2026
            configuration: Release
          - platform: ARM64
            runner: windows-11-vs2026-arm
            configuration: Debug
          - platform: ARM64
            runner: windows-11-vs2026-arm
            configuration: Release
          - platform: x64
            runner: windows-2025-vs2026
            configuration: ASan Debug
          - platform: ARM64
            runner: windows-11-vs2026-arm
            configuration: ASan Debug
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: ./vcpkg-install.ps1 -Platform ${{ matrix.platform }}
      # Step limits (about twice the slowest runs: 13 min for test.ps1, 9 for a consumer build) end a hang the per-test
      # watchdog cannot reach (Foundation, Embedded, the consumer) while the job still has time to upload its logs.
      - shell: pwsh
        timeout-minutes: 25
        # Tooling has one qualification per host. Native runner/filter/watchdog checks remain per profile.
        run: ./test.ps1 -Full -SkipTooling -Configuration "${{ matrix.configuration }}" -Platform ${{ matrix.platform }}
      # The relocated consumer builds its own clean pin and does not require the foreground lease. Retain its
      # independent result after a native-suite failure; a failed step still fails this job and the aggregate gate.
      - name: Qualify the relocated public consumer
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 15
        run: ./test-consumer.ps1 -Configuration "${{ matrix.configuration }}" -Platform ${{ matrix.platform }}
      - name: Qualify the consumer with STL annotations disabled
        if: ${{ !cancelled() && matrix.configuration == 'ASan Debug' }}
        shell: pwsh
        timeout-minutes: 15
        run: ./test-consumer.ps1 -Configuration "${{ matrix.configuration }}" -Platform ${{ matrix.platform }} -DisableStlAnnotations
      - name: Characterize menu resource scaling without capture
        if: ${{ !cancelled() && matrix.platform == 'x64' && matrix.configuration == 'Release' }}
        shell: pwsh
        # The hosted runner owns its desktop; local foreground fixtures still require the person's lease.
        run: ./test.ps1 -Configuration Release -Platform x64 -SkipBuild -SkipTooling -Suites MenuResourceScaling,MenuTextLayoutResources
      # x64 Release also publishes into this checkout's docs/gallery, uploaded below for review. The manual "Publish
      # docs gallery" workflow regenerates it and commits it to a branch.
      - shell: pwsh
        run: ./gallery.ps1 -SkipBuild -Configuration "${{ matrix.configuration }}" -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            .build/logs/*.log
            .build/reports/*.json
            .build/test-artifacts/**
            .build/gallery/**
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ matrix.platform == 'x64' && matrix.configuration == 'Release' }}
        with:
          name: docs-gallery-x64-Release
          path: docs/gallery/
          retention-days: 14
  # One runner measures baseline and candidate serially in twelve independently drawn ABBA/BAAB blocks (24 runs per side).
  # A pull request that changes something measured is compared with
  # the base its merge ref was made on (the candidate is that merge ref) and fails this job on a confirmed degradation or an
  # inconclusive run; a manual dispatch with benchmark_baseline names its own revisions, reports the same verdict in the job
  # summary and stays green for a finding. A manual A/A dispatch is diagnostic only and never qualifies a pull request.
  # permissions stay contents: read; the summary and artifacts need nothing more.
  #
  # Every pull request, including stacked PRs, starts this job: its scope step compares the actual PR base with its merge candidate and decides whether
  # anything the paired benchmark measures changed (Tools/BenchmarkGate.psm1), and the steps after it run only when it did, so a
  # documentation-only pull request ends this job within a couple of minutes. The job is not skipped instead because GitHub
  # reports a skipped job under its unevaluated name expression, which a required check of the same name would never see.
  paired-benchmark:
    # A pull request's check is named apart from the push and manual runs of this job (which report it skipped, or by hand),
    # so that a required check names exactly one check run whatever order they complete in.
    name: ${{ github.event_name == 'pull_request' && 'paired-benchmark (pull request)' || 'paired-benchmark' }}
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.benchmark_baseline != '' || inputs.benchmark_calibration_aa)) }}
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    runs-on: windows-2025-vs2026
    # Twelve blocks across three gating scenarios mean 144 benchmark receipts, plus both builds; retain time to publish on timeout.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 180 || 240 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Whether this pull request changes anything the benchmark measures, and the two commits to compare. A step that cannot
      # decide fails the job, so nothing passes unmeasured because its scope could not be read.
      - id: scope
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        timeout-minutes: 3
        run: ./Tools/Get-BenchmarkScope.ps1
      # What follows runs for a manual dispatch and for a pull request whose scope is measured.
      - if: ${{ github.event_name == 'workflow_dispatch' || steps.scope.outputs.relevant == 'true' }}
        shell: pwsh
        timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 15 }}
        run: ./vcpkg-install.ps1 -Platform x64
      - id: measure
        if: ${{ github.event_name == 'workflow_dispatch' || steps.scope.outputs.relevant == 'true' }}
        shell: pwsh
        timeout-minutes: ${{ github.event_name == 'pull_request' && 150 || 210 }}
        env:
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline || steps.scope.outputs.baseline }}
          BENCHMARK_CANDIDATE: ${{ inputs.benchmark_candidate }}
          BENCHMARK_SCENARIOS: ${{ inputs.benchmark_scenarios || 'Default,MultilineGrid,MultilineGridDistinct' }}
          BENCHMARK_CALIBRATION_AA: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_calibration_aa || false }}
        run: |
          $pairedArgs = @{
            BaselineRevision = $env:BENCHMARK_BASELINE
            CandidateRevision = $env:BENCHMARK_CANDIDATE
            Scenario = @($env:BENCHMARK_SCENARIOS -split ',' | ForEach-Object { $_.Trim() })
            Blocks = 12
          }
          if ($env:BENCHMARK_CALIBRATION_AA -eq 'true') {
            if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or
                [string]::IsNullOrWhiteSpace($env:BENCHMARK_BASELINE) -or
                [string]::IsNullOrWhiteSpace($env:BENCHMARK_CANDIDATE) -or
                $env:BENCHMARK_BASELINE -cne $env:BENCHMARK_CANDIDATE) {
              throw 'A/A calibration requires an explicit workflow_dispatch with identical non-empty baseline and candidate revisions.'
            }
            $pairedArgs.CalibrationAA = $true
          }
          ./performance-paired.ps1 @pairedArgs
      # Also after a failed measurement, to say why there is no verdict. Not after a cancellation: a newer push superseded it.
      - id: verdict
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.relevant == 'true') }}
        shell: pwsh
        env:
          BENCHMARK_PAIR: ${{ steps.scope.outputs.method }}
        run: ./Tools/Publish-BenchmarkVerdict.ps1 -Gate:($env:GITHUB_EVENT_NAME -eq 'pull_request')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.relevant == 'true') }}
        with:
          name: paired-benchmark-x64-Release
          path: |
            .build/paired/*/reports/**
            .build/paired/*/baseline/.build/logs/*.log
            .build/paired/*/candidate/.build/logs/*.log
            .build/logs/*.log
          # Worktree build logs live under each worktree's .build directory.
          include-hidden-files: true
          retention-days: 14
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [validation, windows-tooling, format, native-scope, native, paired-benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          WINDOWS_TOOLING_RESULT: ${{ needs.windows-tooling.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          NATIVE_SCOPE_RESULT: ${{ needs.native-scope.result }}
          NATIVE_SCOPE_OUTPUT: ${{ needs.native-scope.outputs.native }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PAIRED_RESULT: ${{ needs.paired-benchmark.result }}
          PAIRED_RELEVANT: ${{ needs.paired-benchmark.outputs.relevant }}
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline }}
        run: ./Tools/Test-CiGate.ps1
