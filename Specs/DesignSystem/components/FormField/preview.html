<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FormField — static preview</title></head>
<body><div class="dx-stage"><div class="dx-col" style="gap:6px;width:280px">
<label for="width-preview">Width in pixels</label><input id="width-preview" class="dx-field" style="width:280px;min-width:48px" value="5000" aria-describedby="width-description width-error" aria-invalid="true" required>
<span id="width-description" class="dx-cap" style="color:var(--text)">Choose the output width.</span>
<span id="width-error" class="dx-cap" style="color:var(--text)">Enter a width between 1 and 4096 pixels.</span>
</div></div></body>
</html>
