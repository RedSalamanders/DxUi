<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="dx-stage"><div class="dx-col"><span class="dx-btn">Standard</span><span class="dx-cap">Standard</span></div><div class="dx-col"><span class="dx-btn is-hover">Hover</span><span class="dx-cap">Hover</span></div><div class="dx-col"><span class="dx-btn is-pressed">Pressed</span><span class="dx-cap">Pressed</span></div><div class="dx-col"><span class="dx-btn is-disabled">Disabled</span><span class="dx-cap">Disabled</span></div><div class="dx-col"><span class="dx-btn is-primary">Primary</span><span class="dx-cap">Primary</span></div><div class="dx-col"><span class="dx-btn dx-focus">Focused</span><span class="dx-cap">Keyboard focus</span></div><div class="dx-col"><span class="dx-btn is-selector" style="min-width:132px">Parallel <span class="dx-ico">&#xE70D;</span></span><span class="dx-cap">Selector</span></div><div class="dx-col"><span class="dx-btn">Run<span class="dx-split"><span class="dx-ico">&#xE70D;</span></span></span><span class="dx-cap">Split</span></div><div class="dx-col"><span class="dx-btn is-link">Learn more</span><span class="dx-cap">Hyperlink</span></div><div class="dx-col"><span class="dx-btn is-icon"><span class="dx-ico" style="font-size:14px">&#xE72C;</span></span><span class="dx-cap">IconOnly</span></div></div>
<div class="dx-stage"><div class="dx-col"><span class="dx-btn" style="font-size:14px">Chrome label</span><span class="dx-cap">Optional 14 DIP</span></div><div class="dx-col"><span class="dx-btn is-icon"><span class="dx-ico" style="font-size:18px">&#xE710;</span></span><span class="dx-cap">Optional 18 DIP</span></div></div>
<div class="dx-stage"><div class="dx-col"><span class="dx-btn" style="background:transparent;border-color:transparent">Find <small style="margin-left:6px;border:1px solid var(--buttonBorder);border-radius:4px;padding:0 5px">Ctrl+F</small></span><span class="dx-cap">Subtle with keyboard hint</span></div><div class="dx-col"><span class="dx-btn" style="background:transparent">Edit block source</span><span class="dx-cap">Outline</span></div><div class="dx-col"><span class="dx-btn" style="background:transparent;border-color:transparent;border-bottom:2px solid var(--accent);border-radius:0">Compose</span><span class="dx-cap">Selected tab</span></div></div>
</body>
</html>
