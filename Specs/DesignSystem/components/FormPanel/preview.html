<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FormPanel — static preview</title></head>
<body><div class="dx-stage"><div class="dx-col" style="width:410px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%">
<div class="dx-col" style="gap:6px"><label for="form-width">Width in pixels</label><input id="form-width" class="dx-field" style="width:100%;min-width:48px" value="1280"><span class="dx-cap" style="color:var(--text)">Output width</span></div>
<div class="dx-col" style="gap:6px"><label for="form-height">Height in pixels</label><input id="form-height" class="dx-field" style="width:100%;min-width:48px" value="720"><span class="dx-cap" style="color:var(--text)">Output height</span></div>
</div><span class="dx-cap">Two application-selected columns · stable editors</span>
<div style="display:flex;gap:8px;margin-top:12px"><button class="dx-btn is-primary">Apply</button><button class="dx-btn">Cancel</button></div>
<span class="dx-cap">Actions are a separate sibling outside the form body</span>
</div></div></body>
</html>
