<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DxUi</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--windowBackground); color:var(--text); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }
  .sel { fill:var(--selectionFill); }
  .tint { fill:var(--buttonPrimaryFill); }
  .ink { fill:var(--text); }
  .cut { fill:var(--windowBackground); }
  .row-on { fill:var(--accent); }
  .blk { rx:var(--radius-sm); }
  .row { rx:var(--radius-sm); }
  .words { position:absolute; left:24px; bottom:24px; max-width:440px; }
  .name { margin:0; font-size:112px; line-height:.92; font-weight:600; letter-spacing:-.02em; color:var(--text); }
  .tag { margin:12px 0 0 4px; font-family:var(--font-text); font-size:14px; line-height:20px; color:var(--subduedText); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 168×200 bled off the top (the one hue people know it by) · selectionFill 120×136 · text (deep ink) 160×240 bleeding off the right edge · buttonPrimaryFill 304×56 tint band — ≈36% of 960×288
  arrangement one tall accent slab with a selection block and a tint band beneath, the ink column bleeding right; bottoms on one line space-24 above the edge, space-16 gutters
  pattern     dense UI rows, from "Rows are row-height (28)… selectionFill carries selectionText": eight list rows cut into the ink column in windowBackground at a row-height pitch, one selected row in accent
  scales      pitch row-height 28; row height 20; gutters space-16; corners radius-sm (4) on every block and row
-->
<rect class="accent blk" x="24" y="-8" width="168" height="200" rx="4"/>
<rect class="sel blk" x="208" y="56" width="120" height="136" rx="4"/>
<rect class="tint blk" x="24" y="208" width="304" height="56" rx="4"/>
<rect class="ink blk" x="344" y="24" width="160" height="240" rx="4"/>
<rect class="cut row" x="356" y="36" width="112" height="20" rx="4"/>
<rect class="cut row" x="356" y="64" width="84" height="20" rx="4"/>
<rect class="cut row" x="372" y="92" width="96" height="20" rx="4"/>
<rect class="row-on row" x="356" y="120" width="136" height="20" rx="4"/>
<rect class="cut row" x="372" y="148" width="72" height="20" rx="4"/>
<rect class="cut row" x="372" y="176" width="100" height="20" rx="4"/>
<rect class="cut row" x="356" y="204" width="64" height="20" rx="4"/>
<rect class="cut row" x="356" y="232" width="116" height="20" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">DxUi</h1>
<p class="tag">Direct2D controls for Windows: quiet chrome, one accent, exact to the DIP.</p>
</div>
</div>
</body>
</html>
